# Sessions that ccs-up recreates after a reboot or power cut (one per line):
#   name | folder | claude args | env (optional)
# -c continues the last conversation in that folder. If a folder holds two sessions, pin each
# with --resume <id> instead (get the id from `ps -ax | grep claude`). A pinned id goes stale if
# you /clear that session; ccs-up then starts a fresh conversation, so update the id here.
# Add or remove a line here when you add or retire a project. Sessions already running are skipped.
arabayya       | $HOME/Work/arabayya                   | -c
checkpoint     | $HOME/Work/checkpoint                 | -c
delphi         | $HOME/Work/delphi                     | -c
ds920          | $HOME/Work                            | -c
kuudoh         | $HOME/Work/kuudoh/src                 | --resume c44af43e-901f-45b5-8d9a-839629d01b39
lunaris-studio | $HOME/Work/kuudoh/lunaris-studio      | -c
playpatch      | $HOME/Work/playpatch/playpatch        | -c
llc            | $HOME/Work                            | -c | CLAUDE_CONFIG_DIR=$HOME/.claude-llc
