# Phone-friendly tmux for remote Claude Code sessions (see ~/.local/bin/ccs and cc).
# One tmux session per Warp tab; the status bar stays off so tabs look like plain Warp.
# Switch sessions: Ctrl-b s. Detach: Ctrl-b d.
set -g mouse on                      # tap to pick panes/windows, scroll with a swipe
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g status off
set -g set-titles on
set -g set-titles-string "#S"   # Warp tab title = session name
set -g default-terminal "tmux-256color"
set -sg escape-time 10
