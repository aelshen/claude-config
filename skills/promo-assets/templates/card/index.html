<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link card</title>
<link rel="stylesheet" href="lib/promo.css">
<style>
  .card-copy { position: absolute; left: calc(80 * var(--u)); top: calc(90 * var(--u)); width: 50%; }
  .card-copy img[data-logo] { height: calc(70 * var(--u)); margin-bottom: calc(50 * var(--u)); }
  .card-copy .h1 { font-size: calc(66 * var(--u)); }
  .card-copy .body { margin-top: calc(24 * var(--u)); font-size: calc(36 * var(--u)); }
  .card-phone { position: absolute; right: calc(90 * var(--u)); top: calc(70 * var(--u)); }
  .card-phone .phone { width: calc(330 * var(--u)); }
</style>
</head>
<body>
<div id="stage">
  <section data-board="card" class="s-bg">
    <div class="card-copy"><img data-logo="icon"><h1 class="h1" id="headline"></h1><p class="body muted" id="sub"></p></div>
    <div class="card-phone" data-bleed><div class="phone"><img id="shot" alt=""></div></div>
  </section>
</div>
<script src="data.js"></script>
<script src="brand/brand.js"></script>
<script>
  headline.textContent = DATA.headline; sub.textContent = DATA.sub || PROMO_BRAND.url; shot.src = DATA.shot;
  if (PROMO_BRAND.logos.light.wordmark) document.querySelector("[data-logo]").dataset.logo = "wordmark";
</script>
<script src="lib/promo.js"></script>
<script>Promo.boards({ ...DATA.size, boards: [{ id: "card" }] });</script>
</body>
</html>
